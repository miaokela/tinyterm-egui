name: build

# Pushing a tag (v*) rebuilds both packages. No GitHub Release is created —
# the binaries are attached to the workflow run as downloadable artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS: universal .app (arm64 + x86_64) wrapped in a styled .dmg ────────
  macos:
    name: macos-universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Tests
        run: cargo test --release --locked

      - name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build (arm64)
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build (x86_64)
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Package .dmg (universal)
        run: |
          set -euo pipefail
          APP="dist/TinyTerm.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/TinyTerm" \
            target/aarch64-apple-darwin/release/tinyterm-egui \
            target/x86_64-apple-darwin/release/tinyterm-egui
          cp assets/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>TinyTerm</string>
            <key>CFBundleDisplayName</key><string>TinyTerm</string>
            <key>CFBundleExecutable</key><string>TinyTerm</string>
            <key>CFBundleIdentifier</key><string>com.tinyterm.egui</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Version from Cargo.toml instead of a second hard-coded copy.
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          sed -i '' -e "s|<string>0.1.0</string>|<string>$VERSION</string>|g" "$APP/Contents/Info.plist"
          # Drag-to-install layout: artwork + the app next to an /Applications
          # alias. make-dmg.sh drives Finder to write the .DS_Store that carries
          # the background picture and the icon positions.
          scripts/make-dmg.sh "$APP" TinyTerm-macos-universal.dmg TinyTerm
          echo "dmg: $(du -h TinyTerm-macos-universal.dmg | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyTerm-macos-universal
          path: TinyTerm-macos-universal.dmg
          if-no-files-found: error

  # ── Windows: static-CRT .exe (see .cargo/config.toml) wrapped in an NSIS ──
  windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Tests
        run: cargo test --release --locked

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }

      - name: Build
        run: cargo build --release --locked

      - name: Package installer
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps --locked |
            ConvertFrom-Json).packages[0].version
          $root = (Get-Location).Path
          Write-Host "building TinyTerm $version installer"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            "/DAPP_VERSION=$version" `
            "/DAPP_EXE=$root\target\release\tinyterm-egui.exe" `
            "/DOUT_FILE=$root\TinyTerm-windows-x86_64-setup.exe" `
            "/DICON_FILE=$root\assets\icon.ico" `
            "$root\scripts\windows-installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path "TinyTerm-windows-x86_64-setup.exe")) {
            throw "installer not produced"
          }
          Get-Item "TinyTerm-windows-x86_64-setup.exe" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyTerm-windows-x86_64
          path: TinyTerm-windows-x86_64-setup.exe
          if-no-files-found: error
