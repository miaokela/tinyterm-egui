name: build

# Pushing a tag (v*) rebuilds both packages. No GitHub Release is created —
# the binaries are attached to the workflow run as downloadable artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            artifact: TinyTerm-macos-universal
            archive: TinyTerm-macos-universal.dmg
          - name: windows-x86_64
            os: windows-latest
            artifact: TinyTerm-windows-x86_64
            archive: TinyTerm-windows-x86_64-setup.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Tests
        run: cargo test --release --locked

      # ── macOS: build both architectures and fuse them with lipo ────────────
      - name: Add macOS targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build (macOS arm64)
        if: matrix.name == 'macos-universal'
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build (macOS x86_64)
        if: matrix.name == 'macos-universal'
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Package macOS .dmg (universal)
        if: matrix.name == 'macos-universal'
        run: |
          set -euo pipefail
          APP="dist/TinyTerm.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/TinyTerm" \
            target/aarch64-apple-darwin/release/tinyterm-egui \
            target/x86_64-apple-darwin/release/tinyterm-egui
          cp assets/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>TinyTerm</string>
            <key>CFBundleDisplayName</key><string>TinyTerm</string>
            <key>CFBundleExecutable</key><string>TinyTerm</string>
            <key>CFBundleIdentifier</key><string>com.tinyterm.egui</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Drag-to-install layout: artwork + the app next to an /Applications
          # alias. make-dmg.sh drives Finder to write the .DS_Store that carries
          # the background picture and the icon positions.
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          sed -i '' -e "s|<string>0.1.0</string>|<string>$VERSION</string>|g" "$APP/Contents/Info.plist"
          chmod +x scripts/make-dmg.sh
          scripts/make-dmg.sh dist/TinyTerm.app "${{ matrix.archive }}" TinyTerm
          echo "dmg: $(du -h "${{ matrix.archive }}" | cut -f1)"

      # ── Windows: static CRT build (see .cargo/config.toml) + NSIS setup ────
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps --locked |
            ConvertFrom-Json).packages[0].version
          $root = (Get-Location).Path
          Write-Host "building TinyTerm $version installer"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            "/DAPP_VERSION=$version" `
            "/DAPP_EXE=$root\target\release\tinyterm-egui.exe" `
            "/DOUT_FILE=$root\${{ matrix.archive }}" `
            "/DICON_FILE=$root\assets\icon.ico" `
            "$root\scripts\windows-installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path "${{ matrix.archive }}")) { throw "installer not produced" }
          Get-Item "${{ matrix.archive }}" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
